# Signs every policy document that changes on main with Sigstore keyless
# signing and publishes the signed bytes, with their bundles, on the `signed`
# branch. Clients accept a policy only with a bundle from exactly this identity:
#
#   certificate identity  https://github.com/AdverserialAI/confidential-policy/.github/workflows/sign-policy.yml@refs/heads/main
#   OIDC issuer           https://token.actions.githubusercontent.com
#   build trigger         push
#
# That identity string is compiled into the clients. Renaming this file, the
# repository or the branch, or adding another trigger, makes every client refuse
# every new policy. Change those only together with a client release.
#
# There is no signing key. The security of the signature is the security of
# "who can get a commit onto main" plus "who can approve the policy-signing
# environment": see SIGNING.md for the repository settings this relies on.
name: sign-policy

on:
  push:
    branches: [main]
    paths:
      - "policies/**"
      - "releases/**"
      - "registry/**"
      - "deployments/**"

permissions: {}

concurrency:
  group: sign-policy
  cancel-in-progress: false

env:
  # Everything clients or third parties are asked to trust: policies, release
  # manifests, registries, and deployment files when they are mirrored here.
  SIGNED_GLOBS: "policies/*.json releases/*.json registry/*.json deployments/CURRENT deployments/*/*"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Existing validators
        run: |
          python3 -c 'import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]'
          python3 tools/validate_registry.py
          python3 tools/test_validate_registry.py
          python3 tools/test_policy_release_check.py

      - name: Files changed by this push, and release rules for each
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Until something has been signed, sign everything in scope, so that
          # every file the site serves has a bundle; afterwards only what changed.
          all=""
          git ls-remote --exit-code origin refs/heads/signed >/dev/null || all="--all"
          python3 tools/policy_release_check.py --before "$BEFORE" --after "$GITHUB_SHA" --globs "$SIGNED_GLOBS" $all --github-output "$GITHUB_OUTPUT"

  sign:
    needs: validate
    if: needs.validate.outputs.files != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment are the second pair of eyes on
    # every signature. Its deployment branches must be limited to main.
    environment: policy-signing
    permissions:
      contents: read
      id-token: write   # the only job that can obtain a signing certificate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign the exact committed bytes
        env:
          FILES: ${{ needs.validate.outputs.files }}
        run: |
          set -euo pipefail
          mkdir -p signed
          for file in $FILES; do
            # Paths come from tools/policy_release_check.py, which only emits
            # tracked files matching SIGNED_GLOBS with safe characters.
            mkdir -p "signed/$(dirname "$file")"
            git show "$GITHUB_SHA:$file" > "signed/$file"
            cmp "signed/$file" "$file"
            cosign sign-blob --yes --bundle "signed/$file.sigstore.json" "signed/$file"
          done

      - name: Verify what was just signed, the way a client does
        env:
          FILES: ${{ needs.validate.outputs.files }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-policy.yml@refs/heads/main
        run: |
          set -euo pipefail
          for file in $FILES; do
            cosign verify-blob \
              --bundle "signed/$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-trigger push \
              --certificate-github-workflow-ref refs/heads/main \
              "signed/$file"
          done
          (cd signed && find . -type f | sort | xargs sha256sum) | tee signed.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-policy
          path: signed/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # pushes to the `signed` branch only; cannot sign
    steps:
      # Credentials are kept on purpose: this job pushes the `signed` branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-policy
          path: ${{ runner.temp }}/signed

      - name: Publish the signed files on the `signed` branch
        env:
          SIGNED: ${{ runner.temp }}/signed
        run: |
          set -euo pipefail
          git config user.name "policy-signer[bot]"
          git config user.email "policy-signer[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/signed >/dev/null; then
            git fetch origin signed
            git switch --detach origin/signed
          else
            git switch --orphan signed-init
            git commit --allow-empty -m "signed: start"
          fi
          cp -R "$SIGNED"/. .
          git add -A
          git commit -m "signed: $GITHUB_SHA" -m "Signed by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Never force: the branch is an append-only record of signed states.
          git push origin HEAD:refs/heads/signed
